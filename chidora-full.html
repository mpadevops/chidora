<details><summary>How do I join my lesson?<\/summary><p>Your link unlocks 10 minutes before the lesson and is emailed to you.<\/p><\/details>\n<details><summary>Can I pay in naira?<\/summary><p>Yes. Pay by card or bank transfer in naira or dollars via Paystack.<\/p><\/details>\n<details><summary>What if I need to cancel?<\/summary><p>Reschedule or cancel from your dashboard before the lesson starts.<\/p><\/details>\n<details><summary>How are tutors chosen?<\/summary><p>Every tutor passes an interview and a demo lesson.<\/p><\/details><\/div><\/section>\n<footer><div class=\"in\"><div><b style=\"letter-spacing:1px;font-size:16px\">CHIDORA <small style=\"color:var(--org)\">ACADEMY<\/small><\/b>Learn. Rise. Shine.<\/div><div><b>Contact<\/b>hello@chidoraacademy.com<br>WhatsApp: [phone number]<\/div><div><b>Follow us<\/b>@chidoraacademy on Instagram, TikTok, Facebook and YouTube<\/div><div><b>Company<\/b>Chidora Academy Ltd \u00b7 RC [CAC number]<br>Terms \u00b7 Privacy<\/div><\/div><\/footer>\n<div class=\"sticky\"><button class=\"btn\">Find tutors<\/button><button class=\"btn d\">Book trial<\/button><\/div>\n<\/div><\/div>\n<script>\nconst $=id=>document.getElementById(id);\n$('courses').innerHTML=[['ENGLISH','Spoken English','1-to-1 and Speaking Club'],['EXAMS','IELTS & TOEFL','For study and work abroad'],['NIGERIAN','Igbo','For kids and adults'],['NIGERIAN','Yoruba','For kids and adults'],['NIGERIAN','Hausa','For kids and adults'],['WORLD','French','Travel, work, DELF'],['WORLD','German','Study and work in Germany'],['WORLD','Chinese','Mandarin for business'],['WORLD','Spanish','Beginner to advanced'],['WORLD','Arabic','Beginner to advanced']].map(c=>`<div class=\"course\"><small>${c[0]}<\/small><b>${c[1]}<\/b><span>${c[2]}<\/span><\/div>`).join('');\n$('tutors').innerHTML=[['English & IELTS','7+ years teaching adults online. Speaking confidence and IELTS band goals.','English, Igbo','\u20a67,000'],['Igbo','Fun, structured lessons for diaspora children and adult lear ',st:'Applied'}],\n pays:[{n:'Adaeze O.',a:84000,d:'Fri'},{n:'Chinedu N.',a:41000,d:'Fri'},{n:'Marie L.',a:57500,d:'Fri'}],\n rated:{},slots:new Set(['0-1','0-3','1-3','2-1','2-4','4-2','5-0','5-1'])};\nconst TABS={student:['Overview','My lessons','Payments','Speaking Club'],tutor:['Overview','Schedule','Earnings','Reviews','Profile'],admin:['Overview','Tutor applications','Bookings','Payouts','Reports']};\nconst stat=(l,v)=>`<div class=\"stat\"><small>${l}<\/small><b>${v}<\/b><\/div>`;\nconst li=(i,t,s,r)=>`<div class=\"li\"><div class=\"av\">${i}<\/div><div>${t}<small>${s}<\/small><\/div>${r||''}<\/div>`;\nconst pill=(t,c)=>`<span class=\"pill ${c||''}\">${t}<\/span>`;\nfunction view(){const r=S.role,t=S.tab[r];\nif(r==='student'){\n if(t==='Overview')return `<h1>Welcome back, Tola<\/h1><p class=\"sub\">Your next lesson and recent activity.<\/p><div class=\"hero\"><small style=\"color:var(--org);letter-spacing:1px;font-size:11px\">YOUR NEXT LESSON<\/small><h2 style=\"margin:6px 0 0\">IELTS Speaking with Adaeze O.<\/h2><div style=\"font-size:13px;color:#cfd6e8\">Today, 6:00 PM \u00b7 50 min<\/div><div class=\"big\" id=\"cd\"><\/div><button class=\"btn g\" id=\"join\" disabled>Join lesson<\/button><\/div>\n <div class=\"stats\">${stat('Lessons taken','12')}${stat('Hours learned','10')}${stat('Credits left','3')}<\/div>\n <div class=\"box\"><h2>Upcoming<\/h2>${li('AO','IELTS Speaking','Today \u00b7 6:00 PM',pill('Link unlocks 5:50','w'))}${li('AO','IELTS Writing','Tue \u00b7 4:00 PM',pill('Booked','ok'))}<\/div>`;\n if(t==='My lessons')return `<h1>My lessons<\/h1><p class=\"sub\">Rate finished lessons to help other students.<\/p><div class=\"box\"><h2>Past lessons<\/h2>${[['AO','IELTS Speaking','Mon \u00b7 6:00 PM'],['ML','French basics','Sat \u00b7 11:00 AM'],['AO','IELTS Listening','Thu \u00b7 4:00 PM']].map((x,i)=>li(x[0],x[1],x[2],S.rated[i]?pill('\u2605 '+S.rated[i]+' rated','ok'):`<button class=\"btn s\" data-rate=\"${i}\">Rate<\/button>`)).join('')}<\/div><div class=\"box\"><h2>Upcoming<\/h2>${li('AO','IELTS Speaking','Today \u00b7 6:00 PM',`<button class=\"btn s\" data-msg=\"Rescheduling opens in the live app\">Reschedule<\/button>`)}<\/div>`;\n if(t==='Payments')return `<h1>Payments<\/h1><p class=\"sub\">Receipts for every lesson.<\/p><div class=\"box tbl\"><table><tr><th>Date<\/th><th>Item<\/th><th>Amount<\/th><th>Status<\/th><\/tr><tr><td>Oct 6<\/td><td>IELTS Speaking<\/td><td>${N(7000)}<\/td><td>${pill('Paid','ok')}<\/td><\/tr><tr><td>Oct 1<\/td><td>French trial<\/td><td>${N(2000)}<\/td><td>${pill('Paid','ok')}<\/td><\/tr><tr><td>Sep 28<\/td><td>IELTS Writing<\/td><td>${N(7000)}<\/td><td>${pill('Refunded','w')}<\/td><\/tr><\/table><\/div>`;\n return `<h1>Speaking Club<\/h1><p class=\"sub\">Small-group conversation practice.<\/p><div class=\"box\"><h2>${N(15000)} a month \u00b7 8 sessions<\/h2><p class=\"sub\">Groups of 4 to 6 students, led by an experienced English tutor.<\/p><div class=\"stats\">${stat('Sessions used','3 of 8')}${stat('Renews','Nov 4')}<\/div><button class=\"btn\" data-msg=\"Joined the next session (demo)\">Join next session \u00b7 Thu 7 PM<\/button><\/div>`}\nif(r==='tutor'){\n if(t==='Overview')return `<h1>Hello, Adaeze<\/h1><p class=\"sub\">Your week at a glance.<\/p><div class=\"stats\">${stat('This week',N(84000))}${stat('Lessons','12')}${stat('Rating','\u2605 4.9')}${stat('Next payout','Fri')}<\/div><div class=\"box\"><h2>Today<\/h2>${li('TN','IELTS Speaking \u00b7 Tola N.','6:00 PM',`<button class=\"btn g\" data-msg=\"Opens the lesson room (demo)\">Start<\/button>`)}${li('FO','English basics \u00b7 Femi O.','8:00 PM',pill('Booked','ok'))}<\/div><div class=\"box\"><h2>Profile status<\/h2>${li('\u2713','Interview passed','Approved by Chidora',pill('Approved','ok'))}${li('\u25b6','Video intro','Uploaded',pill('Live','ok'))}<\/div>`;\n if(t==='Schedule'){const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],H=['9 AM','12 PM','3 PM','6 PM','8 PM'];return `<h1>Availability<\/h1><p class=\"sub\">Tap slots to open or close them. Students only see open slots.<\/p><div class=\"box\"><div class=\"slots\"><span><\/span>${D.map(d=>`<span>${d}<\/span>`).join('')}${H.map((h,r)=>`<span>${h}<\/span>`+D.map((d,c)=>`<button class=\"${S.slots.has(c+'-'+r)?'on':''}\" data-slot=\"${c}-${r}\"><\/button>`).join('')).join('')}<\/div><p class=\"sub\" style=\"margin:10px 0 0\">${S.slots.size} open slots \u00b7 Times in WAT<\/p><\/div>`}\n if(t==='Earnings')return `<h1>Earnings<\/h1><p class=\"sub\">You keep 75% of each lesson. Paid weekly.<\/p><div class=\"stats\">${stat('This week',N(84000))}${stat('This month',N(310000))}${stat('Pending',N(84000))}<\/div><div class=\"box\"><h2>Last 6 weeks<\/h2><div class=\"bars\" style=\"margin-bottom:22px\">${[40,55,48,70,62,84].map((v,i)=>`<div style=\"height:${v}%\"><span>W${i+1}<\/span><\/div>`).join('')}<\/div><\/div>`;\n if(t==='Reviews')return `<h1>Reviews<\/h1><p class=\"sub\">\u2605 4.9 from 128 students<\/p><div class=\"box\">${['Tola N.','Femi O.','Ngozi A.'].map(n=>li(n.slice(0,2),'\u2605\u2605\u2605\u2605\u2605 \"[Real student review goes here.]\"',n)).join('')}<\/div>`;\n return `<h1>My profile<\/h1><p class=\"sub\">What students see.<\/p><div class=\"box\"><h2>Adaeze O. \u00b7 English &amp; IELTS<\/h2><p class=\"sub\">7+ years teaching adults online. Speaks English, Igbo.<\/p><div class=\"stats\">${stat('Price / 50 min',N(7000))}${stat('Trial price',N(2000))}<\/div><button class=\"btn\" data-msg=\"Saved (demo)\">Edit profile<\/button><\/div>`}\nif(t==='Overview')return `<h1>Admin overview<\/h1><p class=\"sub\">Platform health this week.<\/p><div class=\"stats\">${stat('Bookings','184')}${stat('Revenue',N(1280000))}${stat('Active tutors','37')}${stat('Pending approvals',S.apps.length)}<\/div><div class=\"two\"><div class=\"box\"><h2>Bookings per day<\/h2><div class=\"bars\" style=\"margin-bottom:22px\">${[22,30,26,34,40,18,14].map((v,i)=>`<div style=\"height:${v*2.4}px\"><span>${'MTWTFSS'[i]}<\/span><\/div>`).join('')}<\/div><\/div><div class=\"box\"><h2>Needs attention<\/h2>${li('!','2 refund requests','Review today',pill('Open','w'))}${li('!',S.apps.length+' tutor applications','Awaiting decision',pill('Open','w'))}${li('!','1 no-show','Tue 4 PM',pill('Open','w'))}<\/div><\/div>`;\n if(t==='Tutor applications')return `<h1>Tutor applications<\/h1><p class=\"sub\">Approve only after interview and demo lesson.<\/p><div class=\"box\">${S.apps.length?S.apps.map((a,i)=>li(a.n.slice(0,2),a.n+' \u00b7 '+a.s,a.st,`<span style=\"display:flex;gap:6px\"><button class=\"btn g\" data-ap=\"${i}\">Approve<\/button><button class=\"btn r\" data-rj=\"${i}\">Reject<\/button><\/span>`)).join(''):'<p class=\"sub\">All caught up.<\/p>'}<\/div>`;\n if(t==='Bookings')return `<h1>Bookings<\/h1><p class=\"sub\">Latest lessons across the platform.<\/p><div class=\"box tbl\"><table><tr><th>Student<\/th><th>Tutor<\/th><th>When<\/th><th>Paid<\/th><th>Status<\/th><\/tr><tr><td>Tola N.<\/td><td>Adaeze O.<\/td><td>Today 6 PM<\/td><td>${N(7000)}<\/td><td>${pill('Upcoming','w')}<\/td><\/tr><tr><td>Femi O.<\/td><td>Chinedu N.<\/td><td>Today 4 PM<\/td><td>${N(6000)}<\/td><td>${pill('Done','ok')}<\/td><\/tr><tr><td>Ada U.<\/td><td>Marie L.<\/td><td>Mon 1 PM<\/td><td>${N(7500)}<\/td><td>${pill('Done','ok')}<\/td><\/tr><tr><td>Sam T.<\/td><td>Jonas K.<\/td><td>Tue 4 PM<\/td><td>${N(8000)}<\/td><td>${pill('No-show','x')}<\/td><\/tr><\/table><\/div>`;\n if(t==='Payouts')return `<h1>Weekly payouts<\/h1><p class=\"sub\">Tutors receive 75% after fees.<\/p><div class=\"box\">${S.pays.length?S.pays.map((p,i)=>li(p.n.slice(0,2),p.n,'Due '+p.d,`<b style=\"margin-right:8px\">${N(p.a)}<\/b><button class=\"btn g\" data-pay=\"${i}\">Mark paid<\/button>`)).join(''):'<p class=\"sub\">All payouts sent.<\/p>'}<\/div>`;\n return `<h1>Reports<\/h1><p class=\"sub\">Last 30 days.<\/p><div class=\"stats\">${stat('Revenue',N(4900000))}${stat('Lessons','702')}${stat('Repeat students','61%')}${stat('No-show rate','3.2%')}<\/div><div class=\"box\"><h2>Top subjects<\/h2>${[['English / IELTS',46],['French',22],['Igbo',14],['German',10]].map(x=>`<div style=\"margin:8px 0;font-size:13px\">${x[0]} \u00b7 ${x[1]}%<div style=\"height:8px;background:var(--sand);border-radius:5px;margin-top:4px\"><div style=\"width:${x[1]*2}%;height:8px;background:var(--org);border-radius:5px\"><\/div><\/div><\/div>`).join('')}<\/div>`}\nfunction render(){const r=S.role;\n $('roles').innerHTML=['student','tutor','admin'].map(x=>`<button class=\"${x===r?'on':''}\" data-role=\"${x}\">${x[0].toUpperCase()+x.slice(1)}<\/button>`).join('');\n $('side').innerHTML=TABS[r].map(t=>`<button class=\"${t===S.tab[r]?'on':''}\" data-tab=\"${t}\">${t}<\/button>`).join('');\n $('main').innerHTML=view();\n const q=(s,f)=>document.querySelectorAll(s).forEach(f);\n q('[data-role]',b=>b.onclick=()=>{S.role=b.dataset.role;render()});\n q('[data-tab]',b=>b.onclick=()=>{S.tab[r]=b.dataset.tab;render()});\n q('[data-msg]',b=>b.onclick=()=>toast(b.dataset.msg));\n q('[data-rate]',b=>b.onclick=()=>{S.rated[b.dataset.rate]=5;toast('Thanks for your review');render()});\n q('[data-slot]',b=>b.onclick=()=>{const k=b.dataset.slot;S.slots.has(k)?S.slots.delete(k):S.slots.add(k);render()});\n q('[data-ap]',b=>b.onclick=()=>{toast(S.apps[b.dataset.ap].n+' approved');S.apps.splice(b.dataset.ap,1);render()});\n q('[data-rj]',b=>b.onclick=()=>{toast('Application rejected');S.apps.splice(b.dataset.rj,1);render()});\n q('[data-pay]',b=>b.onclick=()=>{toast('Payout of '+N(S.pays[b.dataset.pay].a)+' sent');S.pays.splice(b.dataset.pay,1);render()});\n clearInterval(window.iv);const cd=$('cd');if(cd){const j=$('join');const tick=()=>{if(S.left<=600){cd.textContent='Link unlocked';j.disabled=false;j.onclick=()=>toast('Opens your private video lesson (demo)');return}const m=Math.floor((S.left-600)/60);cd.textContent=`Link unlocks in ${Math.floor(m/60)}h ${m%60}m ${String((S.left-600)%60).padStart(2,'0')}s`};tick();window.iv=setInterval(()=>{S.left--;tick()},1000)}}\nrender();\n<\/script><script>document.querySelector('header b').style.cursor='pointer';document.querySelector('header b').onclick=function(){parent.postMessage({go:'home'},'*')};\naddEventListener('message',function(e){if(e.data&&e.data.role){S.role=e.data.role;render()}});<\/script><\/body><\/html>\n"};
var TABS=[['🏠 Home','home'],['📅 Book a lesson','booking'],['🎓 Student','dash','student'],['👩🏾‍🏫 Tutor','dash','tutor'],['🛠 Admin','dash','admin']];
var cur=['home'],loaded={};
function go(id,role){
 ['home','booking','dash'].forEach(function(k){document.getElementById(k).classList.toggle('on',k===id)});
 var f=document.getElementById(id);
 if(!loaded[id]){f.srcdoc=P[id];loaded[id]=1;if(role)f.addEventListener('load',function(){f.contentWindow.postMessage({role:role},'*')},{once:true})}
 else if(role)f.contentWindow.postMessage({role:role},'*');
 cur=[id,role];draw();
}
function draw(){document.getElementById('nav').innerHTML=TABS.map(function(t,i){var on=t[1]===cur[0]&&(t[1]!=='dash'||t[2]===cur[1]);return '<button class="'+(on?'on':'')+'" data-i="'+i+'">'+t[0]+'</button>'}).join('');
 document.querySelectorAll('#nav button').forEach(function(b){b.onclick=function(){var t=TABS[b.dataset.i];go(t[1],t[2])}})}
addEventListener('message',function(e){var d=e.data;if(d&&d.go&&['home','booking','dash'].indexOf(d.go)>-1)go(d.go,d.role)});
go('home');
